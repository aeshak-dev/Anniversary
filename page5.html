<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Happy 3 Month Anniversary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
    }

    body {
      background: radial-gradient(circle at 50% 30%, rgba(255, 182, 193, 0.45) 0%, rgba(255, 209, 220, 0.25) 50%, rgba(248, 250, 252, 0.98) 100%), #f8fafc;
      color: #0f172a;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Ambient Glow Backgrounds */
    .bg-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(255, 133, 161, 0.35) 0%, rgba(255, 192, 203, 0.1) 70%);
      filter: blur(50px);
      border-radius: 50%;
      z-index: 0;
      pointer-events: none;
    }

    /* Floating Hearts Animation */
    .heart-particle {
      position: absolute;
      font-size: 1.2rem;
      color: rgba(255, 75, 114, 0.4);
      pointer-events: none;
      z-index: 0;
      animation: floatUp 6s infinite linear;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.7;
      }
      80% {
        opacity: 0.7;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 380px;
      width: 100%;
      text-align: center;
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Card Box styling */
    .card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 182, 193, 0.6);
      border-radius: 32px;
      padding: 40px 24px;
      box-shadow: 0 20px 40px -15px rgba(255, 154, 178, 0.25);
    }

    .icon-crown {
      font-size: 3rem;
      margin-bottom: 16px;
      display: inline-block;
      animation: floatCrown 3s ease-in-out infinite;
    }

    @keyframes floatCrown {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .sub-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #ff4b72;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .message {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.45;
      color: #0f172a;
      margin-bottom: 24px;
    }

    .message span {
      background: linear-gradient(135deg, #ff4b72 0%, #ff758c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-style: italic;
    }

    .divider {
      width: 40px;
      height: 2px;
      background: rgba(255, 182, 193, 0.8);
      margin: 0 auto 20px auto;
      border-radius: 2px;
    }

    .signature {
      font-size: 0.9rem;
      color: #64748b;
      font-weight: 500;
      margin-bottom: 28px;
    }

    /* Back Button Styling */
    .nav-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 14px 20px;
      background: #0f172a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.875rem;
      border-radius: 18px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.15);
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .nav-btn:active {
      transform: scale(0.98);
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(24px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
  </style>
</head>
<body>

  <div class="bg-glow"></div>

  <!-- Background Floating Ambient Hearts -->
  <div class="heart-particle" style="left: 10%; animation-delay: 0s;">💖</div>
  <div class="heart-particle" style="left: 25%; animation-delay: 2s;">✨</div>
  <div class="heart-particle" style="left: 55%; animation-delay: 4s;">🌸</div>
  <div class="heart-particle" style="left: 80%; animation-delay: 1.5s;">💖</div>
  <div class="heart-particle" style="left: 90%; animation-delay: 3.5s;">✨</div>

  <div class="wrapper">
    <div class="card">
      <div class="icon-crown">👑</div>
      <div class="sub-title">Always & Forever</div>
      
      <h1 class="message">
        I love you so so much <span>my princess</span>.
        <br><br>
        Happy 3 Month Anniversary. 💖
        <br><br>
        Mwah
      </h1>

      <div class="divider"></div>
      <p class="signature">Yours forever</p>

      <!-- Back to Index Button -->
      <a href="index.html" class="nav-btn">🔄 Back to Beginning</a>
    </div>
  </div>

</body>
</html>
